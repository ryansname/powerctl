version: "2"

linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - unconvert
    - goconst
    - bodyclose
    - durationcheck
    - errname
    - forcetypeassert
    - nilerr
    - unparam

  exclusions:
    rules:
      # Repeated literals in tests are usually fixture data, not a missing
      # constant — naming them makes the table harder to read, not easier.
      - path: _test\.go
        linters:
          - goconst

linters-settings:
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam

  gosec:
    excludes:
      - G104 # Duplicates errcheck

  goconst:
    min-len: 3
    min-occurrences: 3
